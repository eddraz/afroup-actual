<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AfroUp — Revisión de ayudas</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="assets/mark-black.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="brand-site.css" />
<link rel="stylesheet" href="site-pages.css" />
<style>
  .admin-table{ width:100%; border-collapse:collapse; }
  .admin-table th,.admin-table td{ text-align:left; vertical-align:top; padding:12px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  .admin-table th{ font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .status{ display:inline-flex; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:800; }
  .status.pending{ background:var(--oro-soft); color:#7a5c08; }
  .status.published{ background:var(--cian-soft); color:#0a5560; }
  .status.rejected{ background:#f3d6d6; color:#9b2c2c; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .editor{ display:none; margin-top:18px; }
  .editor.open{ display:block; }
  .msg{ margin-top:14px; font-weight:700; font-size:14.5px; }
  .msg.ok{ color:#0a5560; }
  .msg.err{ color:#9b2c2c; }
  .hidden{ display:none; }
  .empty{ color:var(--muted); font-size:14.5px; padding:8px 0 4px; }
  .rich-editor{ border:1.5px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper); }
  .rich-toolbar{ display:flex; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--cream); flex-wrap:wrap; align-items:center; }
  .rich-toolbar button{ border:0; background:var(--paper); border-radius:8px; min-width:34px; height:32px; font-weight:800; cursor:pointer; flex:none; }
  .field .rich-toolbar select,
  .rich-toolbar select{ flex:none; width:auto; min-width:118px; max-width:132px; height:32px; margin:0; padding:0 28px 0 10px; border:0; border-radius:8px; background-color:var(--paper); background-position:right 8px center; background-size:12px; font:inherit; font-size:13px; font-weight:700; line-height:32px; }
  .rich-color{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:0; width:34px; height:32px; border-radius:8px; background:var(--paper); flex:none; cursor:pointer; overflow:hidden; }
  .rich-color .swatch{ width:14px; height:14px; border-radius:4px; background:#111111; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); pointer-events:none; }
  .rich-color input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; border:0; padding:0; }
  .rich-surface{ min-height:180px; padding:13px 16px; outline:none; font:inherit; line-height:1.55; }
  .rich-surface p{ margin:0 0 .6em; }
  .rich-surface ul, .rich-surface ol{ margin:.2em 0 .6em 1.2em; }
  .rich-source{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body data-active="admin">
<main class="content">
  <div class="wrap" style="padding-bottom:46px;">
    <div class="bread"><a href="/">Inicio</a><span>/</span><a href="/admin">Revisión</a></div>

    <header class="phero ink">
      <div class="patside"></div>
      <span class="ey">Administración</span>
      <h1>Revisar información de ayuda</h1>
      <p class="lead">Inicia sesión para revisar envíos, editar datos y publicar solo la información verificada.</p>
    </header>

    <section class="panel" id="login-panel" style="margin-top:24px;max-width:520px;">
      <h4>Ingreso</h4>
      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:18px;">Entrar</button>
        <p class="msg" id="login-msg" hidden></p>
      </form>
    </section>

    <section class="hidden" id="dashboard">
      <div class="sec-head">
        <h2>Envíos</h2>
            <div class="actions">
              <a class="btn btn-ghost btn-sm" href="/admin/password">Cambiar contraseña</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Cerrar sesión</button>
            </div>
      </div>
      <form class="admin-search" id="admin-search" style="margin:16px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input id="admin-q" type="search" placeholder="Buscar título, lugar, contacto o departamento…" style="flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;" />
        <button class="btn btn-primary btn-sm" type="submit">Buscar</button>
      </form>
      <div class="chips" id="status-chips" style="margin-top:14px;">
        <button class="chip on" type="button" data-status="pending">Pendientes</button>
        <button class="chip" type="button" data-status="published">Publicados</button>
        <button class="chip" type="button" data-status="rejected">Rechazados</button>
        <button class="chip" type="button" data-status="all">Todos</button>
      </div>
      <div class="panel" style="margin-top:18px;overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Departamento</th>
              <th>Estado</th>
              <th>Contacto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entries-body"></tbody>
        </table>
        <p class="empty" id="empty-msg" hidden>No hay registros en este filtro.</p>
      </div>

      <form class="panel editor" id="editor">
        <h4>Editar registro</h4>
        <input type="hidden" id="edit-id" />
        <div class="fgrid">
          <div class="field">
            <label for="edit-department">Ubicación</label>
            <select id="edit-department" required></select>
          </div>
          <div class="field">
            <label for="edit-status">Estado</label>
            <select id="edit-status">
              <option value="pending">Pendiente</option>
              <option value="published">Publicado</option>
              <option value="rejected">Rechazado</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="edit-category">Categoría</label>
          <select id="edit-category">
            <option value="">Selecciona una categoría</option>
            <option value="Punto de acopio">Punto de acopio</option>
            <option value="Donación económica">Donación económica</option>
            <option value="Banco de sangre">Banco de sangre</option>
            <option value="Albergue">Albergue</option>
            <option value="Alimentos / insumos">Alimentos / insumos</option>
            <option value="Otro">Otro</option>
          </select>
          <input id="edit-category-other" type="text" placeholder="Especifica la categoría" hidden />
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="edit-information">Información</label>
          <textarea id="edit-information" required></textarea>
        </div>
        <div class="actions" style="margin-top:18px;">
          <button class="btn btn-primary" type="submit">Guardar cambios</button>
          <button class="btn btn-cian" type="button" id="publish-btn">Publicar</button>
          <button class="btn btn-ghost" type="button" id="reject-btn">Rechazar</button>
        </div>
        <p class="msg" id="edit-msg" hidden></p>
      </form>
    </section>
  </div>
</main>
<script src="site.js"></script>
<script src="drawer.js"></script>
<script src="rich-editor.js"></script>
<script src="admin.js"></script>
</body>
</html>
