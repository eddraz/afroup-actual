<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AfroUp — Cambiar contraseña</title>
<link rel="icon" href="/assets/mark-black.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/brand-site.css" />
<link rel="stylesheet" href="/site-pages.css" />
<style>
  .msg{ margin-top:14px; font-weight:700; font-size:14.5px; }
  .msg.ok{ color:#0a5560; }
  .msg.err{ color:#9b2c2c; }
  .hidden{ display:none; }
  .empty{ color:var(--muted); font-size:14.5px; padding:8px 0 4px; }
</style>
</head>
<body data-active="password">
<main class="content">
  <div class="wrap" style="padding-bottom:46px;">
    <div class="bread"><a href="/">Inicio</a><span>/</span><a href="/admin">Revisión</a><span>/</span><a href="/admin/password">Contraseña</a></div>

    <header class="phero ink">
      <div class="patside"></div>
      <span class="ey">Administración</span>
      <h1>Cambiar contraseña</h1>
      <p class="lead">Esta página es independiente del listado de envíos. Inicia sesión para actualizar la clave del administrador.</p>
    </header>

    <section class="panel" id="login-panel" style="margin-top:24px;max-width:520px;">
      <h4>Ingreso</h4>
      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:18px;">Entrar</button>
        <p class="msg" id="login-msg" hidden></p>
      </form>
    </section>

    <section class="hidden" id="password-panel" style="margin-top:24px;max-width:520px;">
      <div class="actions" style="margin-bottom:16px;">
        <a class="btn btn-ghost btn-sm" href="/admin">Volver a envíos</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Cerrar sesión</button>
      </div>
      <form class="panel" id="password-form">
        <h4>Nueva contraseña</h4>
        <p class="empty" style="padding-top:0;">La nueva contraseña reemplaza la de prueba y queda guardada en la base de datos.</p>
        <div class="field">
          <label for="current-password">Contraseña actual</label>
          <input id="current-password" name="current_password" type="password" autocomplete="current-password" required />
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="new-password">Nueva contraseña</label>
          <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field" style="margin-top:18px;">
          <label for="confirm-password">Confirmar nueva contraseña</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:18px;">Actualizar contraseña</button>
        <p class="msg" id="password-msg" hidden></p>
      </form>
    </section>
  </div>
</main>
<script src="/site.js"></script>
<script src="/drawer.js"></script>
<script src="/admin-password.js"></script>
</body>
</html>
